services:
  postgres:
    image: postgres:16-alpine
    container_name: nivia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nivia
      POSTGRES_PASSWORD: nivia
      POSTGRES_DB: nivia
    ports:
      - "5434:5432"
    volumes:
      - nivia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivia -d nivia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nivia_pg_data:
